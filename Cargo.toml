[package]
name = "inlet"
version = "0.1.0"
edition = "2021"
description = "Gastown reimagined. Kubernetes for AI agents."
license = "MIT"
publish = false

[dependencies]
crossterm = "0.28"
indicatif = "0.17"
libc = "0.2"
mlua = { version = "0.10", features = ["lua54", "vendored"] }
ratatui = "0.29"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
webpki-roots = "0.26"

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
panic = "abort"
strip = true
