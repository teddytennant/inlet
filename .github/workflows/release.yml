name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}
      - name: musl-tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: taiki-e/setup-cross-toolchain-action@12b7ad4acfa95a1476779d6c06699b96ec1691f8 # v1.42.0
        if: matrix.target == 'aarch64-unknown-linux-musl'
        with:
          target: aarch64-unknown-linux-musl
      - name: build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUSTFLAGS: -C target-feature=+crt-static
        run: |
          cargo build --release --target "${{ matrix.target }}"
          file "target/${{ matrix.target }}/release/inlet" | grep -Eq "statically linked|static-pie linked"
          cp "target/${{ matrix.target }}/release/inlet" "$RUNNER_TEMP/inlet-${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: inlet-${{ matrix.target }}
          path: ${{ runner.temp }}/inlet-${{ matrix.target }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: notes
        run: |
          cd dist
          sha256sum inlet-* | tee SHA256SUMS
          {
            echo "Linux static binaries. The cell needs user namespaces. macOS is not shipped."
            echo
            echo '    curl -fsSL https://raw.githubusercontent.com/teddytennant/inlet/main/install.sh | sh'
            echo
            cat SHA256SUMS
          } > "$RUNNER_TEMP/notes.md"
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            dist/inlet-* \
            dist/SHA256SUMS
